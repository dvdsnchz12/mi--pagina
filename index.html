<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Actualizable</title> www.XXIIGYM.es

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Bienvenido a mi página web</h1>
  </header>

  <section id="content">
    <h2>Contenido Actual:</h2>
    <p id="currentContent">Este es el contenido inicial de la página.</p>
  </section>

  <section id="updateSection">
    <h2>Actualizar el contenido</h2>
    <form id="updateForm">
      <label for="newContent">Nuevo contenido:</label>
      <textarea id="newContent" placeholder="Escribe el nuevo contenido aquí..."></textarea>
      <button type="submit">Actualizar contenido</button>
    </form>
  </section>

  <footer>
    <p>2025 - Mi Página Web</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
